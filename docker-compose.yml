services:

  # ------------------------------------
  # DOMINIO DE DATOS
  # ------------------------------------
  db:
    image: timescale/timescaledb-ha:pg15
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cerebrovial}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - db_data:/home/postgres/pgdata/data
      - ./infra/docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  # ------------------------------------
  # DOMINIO DE LÓGICA DE NEGOCIO
  # ------------------------------------
  core_management_api:
    build:
      context: .
      dockerfile: core_management_api/Dockerfile
    env_file: .env
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # Fix de demo (no de raíz): GET /congestion/series materializa el día
          # completo en memoria (~2.39M filas → pico RSS ~2.0-2.3 GB; psycopg2
          # bufferea todo el resultset client-side). A 512M moría por OOM (exit 137).
          # Deuda de raíz: stream server-side (yield_per / server-side cursor) o
          # agregar en SQL, para bajar el pico y volver a un límite chico.
          memory: 4G

  # ------------------------------------
  # DOMINIO EDGE
  # ------------------------------------
  edge_device:
    build:
      context: .
      dockerfile: edge_device/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./videos:/app/videos:ro
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G

  # ------------------------------------
  # DOMINIO DE INTERFAZ
  # ------------------------------------
  frontend:
    build:
      context: ./frontend_ui
      dockerfile: Dockerfile
      args:
        # Horneadas en el bundle de Vite en build-time. Explícitas (no
        # accidentales): un deploy con otro host solo cambia estos valores.
        VITE_CORE_API_URL: http://localhost:8001
        VITE_EDGE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - core_management_api
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  db_data:
