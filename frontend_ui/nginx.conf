server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fallback SPA: cualquier ruta que no resuelva a un archivo cae en
    # index.html para que react-router (createBrowserRouter) tome el control
    # client-side. Sin esto, recargar/entrar directo a /login (o cualquier
    # path != /) devuelve 404 del nginx default. (DEUDA-NGINX-SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash de Vite (dist/assets/*): el nombre cambia en cada build,
    # son inmutables -> cache larga.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html es el punto de entrada que referencia los assets hasheados:
    # no se cachea para que un build nuevo se tome al recargar.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
