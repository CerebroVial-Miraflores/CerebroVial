speed_estimation:
  enabled: true
  pixels_per_meter: 10.0

persistence:
  enabled: true
  type: "postgres" # CSV eliminado en Fase 5b (decisión #8); builder solo acepta postgres.
  interval_seconds: 5         # 5s validado para 1 cámara en MVP1; reconsiderar para multi-cámara (carga de INSERTs a Timescale).

server:
  host: "0.0.0.0"
  port: 8000

# Performance tuning for latency and fluidity
performance:
  # Target resolution (lower = less latency, less bandwidth)
  target_width: 1280
  target_height: 720

  # OpenCV buffer size (1 = minimum latency, higher = smoother but more delay)
  opencv_buffer_size: 30

  # Frame processing
  detect_every_n_frames: 1 # Run YOLO detection every N frames

  # YouTube stream quality (affects download speed and latency)
  # Options: "worst", "best[height<=480]", "best[height<=720]", "best"
  youtube_format: "best"

  # Pipeline buffers
  frame_buffer_size: 30
  result_buffer_size: 30
  capture_buffer_size: 60
  target_fps: 30
  source_fps: 30

model:
  path: "yolo11n.pt"
  conf_threshold: 0.3
  # imgsz (B1 1c): resolución de inferencia por-llamada, palanca per-cámara. Se deja
  # ausente a propósito: la política de default vive en UN solo lugar
  # (DEFAULT_IMGSZ en application/processors/smart_detection.py, hoy 640 — Fase 2),
  # que el scheduler aplica cuando este campo no está. Descomentar SOLO para override
  # per-cámara; el techo (768/GPU) se explora con datos en deploy centralizado.
  # imgsz: 640

display: true
