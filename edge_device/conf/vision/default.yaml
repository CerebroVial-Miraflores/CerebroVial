# source: "https://www.youtube.com/watch?v=qMYlpMsWsBE"
source: "https://www.youtube.com/watch?v=6dp-bvQ7RWo"

# source: "https://www.youtube.com/watch?v=0IgonpX1jMg"
# source: "https://www.youtube.com/watch?v=rPxWUFTKgds"
source_type: "auto" # webcam, file, youtube, ip_cam, auto (dispatcher por contenido del source)
loop: true # re-loop de archivos locales al EOF; false recupera la semántica EOF->None (no aplica a streams/webcam)
camera_id: null

# Knobs de inferencia a nivel de instancia (topología B / 15Hz). Override por env:
# VISION_DEVICE / VISION_ANALYZE_FPS / VISION_IMGSZ. Defaults = comportamiento actual.
device: auto          # auto (cuda→mps→cpu) | cpu | mps | cuda. Forzado no disponible → error al boot.
analyze_fps: 25       # cadencia de ANÁLISIS de la fuente full-decode = nativo del HLS de Claro (paceado con -re). No toca el stream del browser.
imgsz: 640            # resolución de inferencia (calidad↔velocidad). 640 = nativo de ultralytics.
max_inference_cameras: null  # tope de cámaras infiriendo a la vez (null = sin tope). El operador lo fija según el harness.

# ROI Zones for counting
zones:
